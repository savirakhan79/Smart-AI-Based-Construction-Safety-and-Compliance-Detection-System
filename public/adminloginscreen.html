<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyBjubB9ZrlMKWz1mnZiHTQTWCCTiSA_nSY",
  authDomain: "safesite-2a067.firebaseapp.com",
  databaseURL: "https://safesite-2a067-default-rtdb.firebaseio.com",
  projectId: "safesite-2a067",
  storageBucket: "safesite-2a067.appspot.com",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const loginForm = document.getElementById("loginForm");
const errorMsg = document.getElementById("errorMsg");
const successMsg = document.getElementById("successMsg");

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  errorMsg.classList.add("hidden");
  successMsg.classList.add("hidden");

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  // Basic Validation
  if (!email || !password) {
    errorMsg.textContent = "Please enter both Email and Password";
    errorMsg.classList.remove("hidden");
    return;
  }

  try {
    // 1. Send login request to your Backend
    const res = await fetch("http://localhost:5000/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (res.ok && data.success) {
      // 2. ✅ Success: Set local session
      localStorage.setItem("isLoggedIn", "true");
      localStorage.setItem("adminEmail", email);

      // 3. Log login to Firebase (Optional History)
      try {
          await push(ref(db, "admin_logins"), {
            email,
            time: new Date().toISOString(),
            status: "Success"
          });
      } catch(e) { console.log("Firebase Log Error", e); }

      successMsg.textContent = "Login successful! Redirecting...";
      successMsg.classList.remove("hidden");

      // 4. Redirect to dashboard
      setTimeout(() => {
        window.location.href = "Admin-Dashboard.html";
      }, 1000);

    } else {
      // ❌ Failed Login
      errorMsg.textContent = data.error || "Invalid Email or Password";
      errorMsg.classList.remove("hidden");
    }

  } catch (err) {
    errorMsg.textContent = "Server is not running! (Check port 5000)";
    errorMsg.classList.remove("hidden");
  }
});
</script>

<script>
function togglePassword() {
  const password = document.getElementById("password");
  const eyeIcon = document.getElementById("eyeIcon");

  if (password.type === "password") {
    password.type = "text";
    eyeIcon.textContent = "visibility_off";
  } else {
    password.type = "password";
    eyeIcon.textContent = "visibility";
  }
}
</script>
